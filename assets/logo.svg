<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d4a3"/>
      <stop offset="45%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#8a7044"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#6e552c"/>
    </linearGradient>
    <radialGradient id="ballBlack" cx="35%" cy="32%">
      <stop offset="0%" stop-color="#3a352d"/>
      <stop offset="55%" stop-color="#0e0d0a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>

  <!-- 8-ball icon (small, refined) -->
  <g transform="translate(300, 38)">
    <circle cx="0" cy="0" r="28" fill="url(#ballBlack)" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <ellipse cx="-9" cy="-10" rx="7" ry="4" fill="#ffffff" opacity="0.18"/>
    <circle cx="0" cy="0" r="11" fill="url(#goldShine)"/>
    <text x="0" y="5" text-anchor="middle"
      font-family="Marcellus, Cormorant Garamond, Georgia, serif"
      font-weight="500" font-size="16" fill="#1a140a" font-style="italic">8</text>
  </g>

  <!-- Top hairline -->
  <line x1="180" y1="92" x2="280" y2="92" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.55"/>
  <line x1="320" y1="92" x2="420" y2="92" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.55"/>

  <!-- POOL BAR (serif, refined) -->
  <text x="300" y="142"
    text-anchor="middle"
    font-family="Marcellus, Cormorant Garamond, Georgia, serif"
    font-weight="400"
    font-size="58"
    fill="url(#goldShine)"
    letter-spacing="8">POOL BAR</text>

  <!-- BILLIARD & BOWLING (sans-serif, tracked) -->
  <text x="300" y="172"
    text-anchor="middle"
    font-family="'Heebo', 'Inter', Arial, sans-serif"
    font-weight="500"
    font-size="11"
    fill="#c9a96e"
    letter-spacing="8" opacity="0.95">BILLIARD &amp; BOWLING</text>

  <!-- Bottom hairline -->
  <line x1="200" y1="190" x2="400" y2="190" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.5"/>
  <circle cx="300" cy="190" r="2.2" fill="url(#goldGrad)"/>
</svg>
